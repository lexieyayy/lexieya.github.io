<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sets — lexies thingy ;3</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body class="sets-page">

    <main class="container">

        <header class="site-header">

            <nav>
                <a href="./index.html">home</a>
                <a href="./sets.html" class="active">sets</a>
            </nav>

        </header>


        <section class="sets-top">

            <div class="sets-title">

                <span class="eyebrow">archive</span>

                <h1>sets</h1>

                <p id="random-subtitle">every fight and every score</p>

            </div>


            <div class="search-wrapper">

                <div class="search-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5"></circle>
                        <path d="M16 16L21 21"></path>
                    </svg>
                </div>

                <input
                    type="text"
                    placeholder="search sets..."
                    aria-label="Search sets"
                >

                <span class="search-key">⌕</span>

            </div>

        </section>


        <section class="set-controls">

            <div class="filters">

                <button class="filter active" data-filter="all">
                    all
                    <span>0</span>
                </button>

                <button class="filter" data-filter="win">
                    wins
                    <span>0</span>
                </button>

                <button class="filter" data-filter="loss">
                    losses
                    <span>0</span>
                </button>

            </div>


            <div class="set-count">
                <span>0 sets</span>
            </div>

        </section>


        <section class="sets-list" id="sets-list">

            <div class="empty-state" id="sets-loading">

                <div class="empty-icon">—</div>

                <h3>loading sets</h3>

                <p>pulling the archive...</p>

            </div>

        </section>


        <section class="owner-panel" id="owner-panel">

            <button
                class="owner-button"
                id="login-button"
                type="button"
            >
                login
            </button>


            <div
                class="owner-tools"
                id="owner-tools"
            >

                <button
                    class="owner-button"
                    id="add-set-button"
                    type="button"
                >
                    add set
                </button>

                <button
                    class="owner-button subtle"
                    id="logout-button"
                    type="button"
                >
                    logout
                </button>

            </div>

        </section>


        <!-- LOGIN MODAL -->

        <div
            class="modal-backdrop"
            id="login-modal"
        >

            <div class="modal">

                <div class="modal-header">

                    <div>

                        <span class="eyebrow">
                            owner
                        </span>

                        <h2>
                            login
                        </h2>

                    </div>


                    <button
                        class="modal-close"
                        data-close-modal
                        type="button"
                    >
                        ×
                    </button>

                </div>


                <form id="login-form">

                    <label>
                        email

                        <input
                            id="login-email"
                            type="email"
                            autocomplete="email"
                            required
                        >
                    </label>


                    <label>
                        password

                        <input
                            id="login-password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                    </label>


                    <p
                        class="form-error"
                        id="login-error"
                    ></p>


                    <button
                        class="form-submit"
                        type="submit"
                    >
                        sign in
                    </button>

                </form>

            </div>

        </div>


        <!-- ADD SET MODAL -->

        <div
            class="modal-backdrop"
            id="add-set-modal"
        >

            <div class="modal">

                <div class="modal-header">

                    <div>

                        <span class="eyebrow">
                            archive
                        </span>

                        <h2>
                            add set
                        </h2>

                    </div>


                    <button
                        class="modal-close"
                        data-close-modal
                        type="button"
                    >
                        ×
                    </button>

                </div>


                <form id="add-set-form">

                    <label>
                        opponent

                        <input
                            id="set-opponent"
                            type="text"
                            maxlength="100"
                            required
                        >
                    </label>


                    <div class="form-row">

                        <label>
                            result

                            <select
                                id="set-result"
                                required
                            >
                                <option value="win">
                                    win
                                </option>

                                <option value="loss">
                                    loss
                                </option>
                            </select>

                        </label>


                        <label>
                            format

                            <input
                                id="set-format"
                                type="text"
                                placeholder="FT10"
                                maxlength="30"
                                required
                            >
                        </label>

                    </div>


                    <div class="form-row">

                        <label>
                            your score

                            <input
                                id="set-player-score"
                                type="number"
                                min="0"
                                step="1"
                                required
                            >
                        </label>


                        <label>
                            opponent score

                            <input
                                id="set-opponent-score"
                                type="number"
                                min="0"
                                step="1"
                                required
                            >
                        </label>

                    </div>


                    <label>
                        character

                        <input
                            id="set-character"
                            type="text"
                            maxlength="50"
                            required
                        >
                    </label>


                    <label>
                        date

                        <input
                            id="set-date"
                            type="date"
                            required
                        >
                    </label>


                    <p
                        class="form-error"
                        id="add-set-error"
                    ></p>


                    <button
                        class="form-submit"
                        type="submit"
                    >
                        save set
                    </button>

                </form>

            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./script.js?v=4"></script>

</body>
</html>
